<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>psan</title>
  <meta name="theme-color" content="#EEF2FF">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/psan.ico">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Login -->
  <section id="view-login" hidden>
    <div class="login-box">
      <img class="login-logo" src="/icons/icon-192.png" alt="psan" width="88" height="88">
      <p class="login-sub">¿Quién eres?</p>
      <div id="login-names" class="login-names"></div>
      <div id="login-pin" hidden>
        <p id="pin-user" class="pin-user"></p>
        <div id="pin-dots" class="pin-dots" aria-live="polite"></div>
        <p id="pin-error" class="pin-error" role="alert"></p>
        <div id="pin-pad" class="pin-pad"></div>
        <button id="pin-back" class="btn-ghost" type="button">← Cambiar usuario</button>
      </div>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="header">
      <img class="header-brand" src="/icons/icon-192.png" alt="psan" width="36" height="36">
      <div class="header-actions">
        <span id="me-avatar" class="avatar" aria-hidden="true"></span>
        <button id="add-btn" class="icon-btn" type="button" hidden aria-label="Agregar">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="push-toggle" class="icon-btn" type="button" hidden
                aria-label="Notificaciones" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
          </svg>
        </button>
        <button id="logout" class="icon-btn" type="button" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="m16 17 5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <section id="view-tareas" hidden></section>
      <section id="view-calendario" hidden></section>
      <section id="view-listas" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Navegación principal">
      <a href="#tareas" data-tab="tareas">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <span>Tareas</span>
      </a>
      <a href="#calendario" data-tab="calendario">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span>Calendario</span>
      </a>
      <a href="#listas" data-tab="listas">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
        <span>Listas</span>
      </a>
    </nav>
  </div>

  <!-- Sheet/modal genérico -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
